<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar container">
        <div class="logo-wrapper">
          <img src="assets/img/logo.svg" alt="Website Logo" />
        </div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#contact" class="nav-link">Contact</a>
          </li>
          <li class="nav-item">
            <a href="#features" class="btn btn-light-green">How it works</a>
          </li>
          <li class="nav-item">
            <a href="#plan" class="btn btn-green">Get Started</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="container column">
        <section class="hero">
          <div class="hero-content">
            <h2>Create Engaging Landing Pages</h2>
            <p>
              Build beautiful landing pages in record time with
              <span class="text-blue">Anima</span>’s Landing Page UI kit for
              Figma. No code required!
            </p>
            <div class="hero-btns">
              <button class="btn btn-green">
                <img src="assets/img/rocket.svg" alt="Image of a rocket" /> Get
                Started
              </button>
              <button class="btn btn-white">How it works</button>
            </div>
          </div>
          <img src="assets/img/hero-img.png" alt="Image in the hero section" />
        </section>

        <section class="client-logos">
          <div class="client-list">
            <img src="assets/img/airbnb.png" alt="Airbnb logo" />
            <img src="assets/img/google.png" alt="Google logo" />
            <img src="assets/img/amazon.png" alt="Amazon logo" />
            <img src="assets/img/microsoft.png" alt="Microsoft logo" />
            <img src="assets/img/fedex.png" alt="FedEx logo" />
            <img src="assets/img/hubspot.png" alt="HubSpot logo" />
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
